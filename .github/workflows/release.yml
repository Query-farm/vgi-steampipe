name: Release

# Push a tag like v0.1.0. This gates on CI, then the shared vgi-actions workflow
# builds the worker (cgo, embedded DuckDB evaluator) on native runners (linux amd64/arm64, macOS arm64,
# Windows amd64), signs each archive with cosign, attests SLSA provenance, and
# attaches them to the GitHub release.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    # In the template repositories a vX.Y.Z tag is a template version, not a worker
    # release, so only a manual run builds there. Forks release on every tag.
    if: ${{ github.event_name != 'push' || !startsWith(github.repository, 'Query-farm/vgi-starter-') }}
    uses: ./.github/workflows/ci.yml

  release:
    needs: [ci]
    permissions:
      contents: write        # create the release, attach assets
      id-token: write        # keyless signing + provenance
      attestations: write
    uses: Query-farm/vgi-actions/.github/workflows/go-release.yml@v1
    secrets: inherit
    with:
      package: ./cmd/vgi-steampipe-worker
      bin: vgi-steampipe-worker
      go_version: "1.26"
      # The worker imports vgi-go/vgi/exprduckdb (embedded DuckDB): cgo.
      cgo: "1"
      version_check_cmd: ci/check-version.sh
